name: 洲弹 · 云端采集

# 电脑关机也照常采集：GitHub 的定时器在云端跑，与本机无关。
#
# ★ 为什么不再是 "*/30 * * * *"（2026-10-29 修复）
#   GitHub 官方只保证 schedule「尽量」触发，高峰期会延迟、甚至直接丢轮次。
#   实测 "*/30" 全天只跑成 10 轮（间隔 55~71 分钟），只有设计密度的一半，
#   于是「云端最新数据」常年滞后 40~70 分钟，贴着 70 分钟的异常线。
#   → 改成「触发后 job 内部自己循环 2 轮」：
#     采样节奏由 job 自己 sleep 保证，不再赌 GitHub 的半小时定时器；
#     万一某次触发被丢，下一轮按缺口自动补到 3 轮（自愈）。
#
# ★ 为什么每个 job 要循环 10 轮（2026-10-30 再加长）
#   实测 GitHub 的定时触发会**整段消失**：2026-10-29 22:50 之后连续 96 分钟一次都没触发
#   （那期间只有人工 dispatch 才跑）。只覆盖 1 小时的 job，遇上一次这种空窗就断 1~2 个采样点。
#   → job 内循环 10 轮 = 连续覆盖 4.5 小时，只要**每 4.5 小时有一个触发成功**节奏就不断；
#     触发仍然是每小时两次，job 死掉时最多 1 小时内就会被下一个触发接上。
#   占用 runner 的时间不变（本来就是一小时接一小时地跑），只是触发依赖度降到 1/4.5。
#
# ★ 为什么每小时触发两次（:17 + :47）
#   丢掉的轮次**没有任何 run 记录**，Actions 面板全绿，只能靠冗余触发兜底：
#   两个触发点相隔 30 分钟，同时被丢的概率远低于单个。
#   :47 那次正常情况会命中「距上次采样 < 12 分钟 → 0 轮」直接空转退出，
#   只有当 :17 那次确实没跑成时，它才真正接上。
#
#   触发点选 :17 而不是整点——整点是 GitHub 的调度高峰，最容易延迟。
on:
  schedule:
    - cron: "17 * * * *"
    - cron: "47 * * * *"
  workflow_dispatch:        # 支持手动点一下立即采一轮
    inputs:
      gap_sec:
        description: "轮间隔秒数（调试用：填 20 可在几分钟内跑完 10 轮做冒烟；留空=1800）"
        required: false
        default: "1800"
      rounds:
        description: "轮数（调试用：留空则按距上次采样的缺口自动判定）"
        required: false
        default: ""

permissions:
  contents: write           # 需要写权限才能把数据提交回仓库

concurrency:
  group: zhoudan-collect
  cancel-in-progress: false # 排队而不是取消，避免丢轮次

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 330    # 10 轮 = 9 × 30 分钟 + 采集耗时 ≈ 273 分钟，留足余量（job 上限 6 小时）

    steps:
      - name: 检出数据仓库
        uses: actions/checkout@v4

      - name: 决定本轮跑几轮（按数据缺口自愈）
        id: plan
        run: |
          # 缺口按「当天数据文件最后一条采样」算，比 git log 准：
          # git log 拿到的是最后一次提交时间，可能只是改 workflow，不是真采到了数据。
          DAY=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          F="data/${DAY}.jsonl"
          LAST=0
          if [ -f "$F" ]; then
            LAST=$(tail -n 1 "$F" \
              | python3 -c "import sys,json;print(json.loads(sys.stdin.read())['t'])" 2>/dev/null \
              || echo 0)
          fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac   # 解析失败/非数字 → 退回 git log
          if [ "$LAST" -eq 0 ] 2>/dev/null; then
            LAST=$(git log -1 --format=%ct 2>/dev/null || echo 0)
          fi
          case "$LAST" in ''|*[!0-9]*) LAST=0 ;; esac   # 再校验一次，保证后面能做整数比较
          NOW=$(date +%s)
          GAP=$(( (NOW - LAST) / 60 ))
          if   [ "$GAP" -lt 12 ];  then ROUNDS=0   # 刚采过（冗余触发撞上在跑的 job）→ 空转退出
          else                          ROUNDS=10  # 连续覆盖 4.5 小时，把触发依赖度降到 1/4.5
          fi
          echo "距上次采样 ${GAP} 分钟 → 本轮跑 ${ROUNDS} 轮"
          echo "rounds=$ROUNDS" >> "$GITHUB_OUTPUT"

      - name: 循环采集，每轮独立提交
        env:
          ROUNDS: ${{ github.event.inputs.rounds || steps.plan.outputs.rounds }}
          GAP_SEC: ${{ github.event.inputs.gap_sec || 1800 }}   # 轮间隔 30 分钟，与本地采集同频；手动触发可覆盖
        run: |
          # 提交身份必须在这里配：runner 每次都是干净环境，漏了会让 git commit 直接 exit 128
          git config user.name  "zhoudan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ "$ROUNDS" -eq 0 ]; then
            echo "本轮无需采集（距上次采样太近），直接退出"
            exit 0
          fi
          for i in $(seq 1 "$ROUNDS"); do
            echo "===== 第 $i / $ROUNDS 轮 ====="
            START=$(date +%s)

            # 采集失败只告警：站点临时抽风不该中断后面几轮
            python3 -u collect.py || echo "::warning::第 $i 轮采集返回非零，继续下一轮"

            git add data hist
            if git diff --cached --quiet; then
              echo "第 $i 轮无新增数据，跳过提交"
            else
              git commit -m "data: $(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M') 采集"
              for k in 1 2 3; do
                git push && break
                echo "推送失败，rebase 后重试（第 $k 次）"
                git pull --rebase --autostash
              done
            fi

            [ "$i" -lt "$ROUNDS" ] || break
            # 对齐到「上一轮开始 + 30 分钟」，否则采集耗时会把间隔越推越晚
            WAIT=$(( START + GAP_SEC - $(date +%s) ))
            if [ "$WAIT" -gt 0 ]; then
              echo "等待 ${WAIT}s 进入下一轮"
              sleep "$WAIT"
            fi
          done

          # 落盘校验：上面每轮只重试 3 次 push，全挂的话脚本会「看起来正常」地跑完，
          # 但数据留在 runner 里、job 结束即丢弃 —— 必须显式兜住。
          BR="${GITHUB_REF_NAME:-main}"
          git fetch origin "$BR" 2>/dev/null || true
          UNPUSHED=$(git rev-list --count "origin/$BR..HEAD" 2>/dev/null || echo "?")
          if [ "$UNPUSHED" = "?" ] || [ "$UNPUSHED" -gt 0 ]; then
            echo "::error::本轮有 ${UNPUSHED} 个提交没推送到 ${BR}，数据会随 runner 结束丢失"
            exit 1
          fi
          echo "落盘校验通过：全部提交已进入 origin/${BR}"

      - name: 本轮健康自检
        if: always()
        run: |
          DAY=$(TZ=Asia/Shanghai date +'%Y-%m-%d')
          F="data/${DAY}.jsonl"
          if [ -f "$F" ]; then
            N=$(grep -c . "$F" || echo 0)
            LAST=$(tail -n 1 "$F" | python3 -c "import sys,json,time;print(time.strftime('%H:%M',time.localtime(json.loads(sys.stdin.read())['t'])))" 2>/dev/null || echo "?")
            echo "今天已采 ${N} 个采样点，最后一个 ${LAST}"
          else
            echo "::warning::今天还没有数据文件 ${F}"
          fi
